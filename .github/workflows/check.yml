name: API checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        env:
          MONGOMS_DISABLE_POSTINSTALL: '1'
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
